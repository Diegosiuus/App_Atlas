name: Deploy Atlas Earth Calc to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Flet publishing tools
        run: python -m pip install "flet-cli>=1.0,<2" "flet-web>=1.0,<2"
      - name: Build static PWA
        run: >-
          flet publish src/main.py
          --python-version 3.12
          --base-url "/${{ github.event.repository.name }}/"
          --route-url-strategy hash
          --assets assets
          --distpath ../dist
          --app-name "Atlas Earth Calc"
          --app-short-name "Atlas Earth Calc"
          --app-description "Calculadoras y predicciones para Atlas Earth"
          --pwa-background-color "#F2F6F5"
          --pwa-theme-color "#087F72"
      - name: Set unique PWA manifest ID
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("dist/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          repository_name = os.environ["GITHUB_REPOSITORY"].rsplit("/", 1)[1]
          project_path = f"/{repository_name}/"
          manifest["id"] = f"{project_path}atlas-planner-v3"
          manifest["start_url"] = project_path
          manifest["scope"] = project_path
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
